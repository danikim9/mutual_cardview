<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mutual 지인 목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 단일 컬럼 모바일 피드. 가입 → 성별 필터 → 카드(여성 핑크 / 남성 블루) → 바텀시트 */
:root{
  --bg:#F6F6F9; --surface:#FFFFFF; --ink:#16181F; --muted:#6E7282; --line:#E8E9EF;
  --pink:#E5487F; --pink-ink:#B72A5E; --pink-soft:#FDEEF3; --pink-line:#F8CFDD;
  --blue:#3B6FE3; --blue-ink:#2350B8; --blue-soft:#EDF2FE; --blue-line:#CBDAFB;
  --shadow:0 1px 2px rgba(22,24,31,.04),0 6px 20px rgba(22,24,31,.05);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101116; --surface:#191B22; --ink:#EEEFF4; --muted:#9A9EAE; --line:#2A2D38;
  --pink:#F06A99; --pink-ink:#FF9EC0; --pink-soft:#33202A; --pink-line:#5A2E40;
  --blue:#6A94F5; --blue-ink:#A9C2FF; --blue-soft:#1C2438; --blue-line:#2F4270;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101116; --surface:#191B22; --ink:#EEEFF4; --muted:#9A9EAE; --line:#2A2D38;
  --pink:#F06A99; --pink-ink:#FF9EC0; --pink-soft:#33202A; --pink-line:#5A2E40;
  --blue:#6A94F5; --blue-ink:#A9C2FF; --blue-soft:#1C2438; --blue-line:#2F4270;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;letter-spacing:inherit}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}

/* 헤더 */
header{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo i{display:block;width:22px;height:14px;position:relative}
.logo i::before,.logo i::after{content:"";position:absolute;top:0;width:14px;height:14px;border-radius:50%;opacity:.88}
.logo i::before{left:0;background:var(--pink)}
.logo i::after{right:0;background:var(--blue)}
h1{font-size:24px;line-height:1.35;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}

/* 가입 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:var(--ink)}
label small{font-weight:400;color:var(--muted)}
input,textarea{font-size:15px;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:13px 14px;width:100%;transition:border-color .15s,background .15s}
input:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--surface)}
textarea{min-height:88px;resize:vertical}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:13px;color:var(--muted);line-height:1.5}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.btn{font-size:15px;font-weight:700;border:0;border-radius:14px;padding:15px;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.f{background:var(--pink);color:#fff}
.btn.m{background:var(--blue);color:#fff}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--pink-ink);font-size:13px;margin:0}

/* 필터 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.chip{font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip[data-g="여성"][aria-pressed="true"]{background:var(--pink);color:#fff}
.chip[data-g="남성"][aria-pressed="true"]{background:var(--blue);color:#fff}
.count{font-size:13px;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}

/* 카드 */
.list{display:flex;flex-direction:column;gap:12px}
.card{--c:var(--blue);--ci:var(--blue-ink);--cs:var(--blue-soft);--cl:var(--blue-line);
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;color:inherit;cursor:pointer;width:100%;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card.f,.sheet.f{--c:var(--pink);--ci:var(--pink-ink);--cs:var(--pink-soft);--cl:var(--pink-line)}
.card.m,.sheet.m{--c:var(--blue);--ci:var(--blue-ink);--cs:var(--blue-soft);--cl:var(--blue-line)}
.card:hover{border-color:var(--cl)}
.card:active{transform:scale(.99)}
.head{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--cs);color:var(--ci);display:grid;place-items:center;font-weight:800;font-size:17px;border:1px solid var(--cl)}
.who{display:flex;flex-direction:column;min-width:0;gap:1px}
.nick{font-size:17px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.35}
.meta{font-size:13px;color:var(--muted)}
.pill{margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--ci);background:var(--cs);border-radius:999px;padding:4px 10px}
.job{font-size:14px;font-weight:600;margin:0}
.job span{font-weight:400;color:var(--muted)}
.intro{margin:0;font-size:14px;color:var(--ink);opacity:.86;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-top:12px;border-top:1px dashed var(--line)}
.rel{font-weight:600;color:var(--ci)}
.sent{margin-left:auto;font-weight:700;color:var(--ci)}

/* 바텀시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(10,11,16,.48);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;display:flex;flex-direction:column}
.s-top{background:var(--cs);padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--cl)}
.s-top .av{width:56px;height:56px;font-size:22px;background:var(--surface)}
.s-top .pill{background:var(--surface)}
.s-top h2{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0}
.s-body{padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:6px}
.sec b{font-size:12px;font-weight:700;color:var(--ci)}
.sec p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.note{font-size:12px;color:var(--muted);margin:0}
.done{text-align:center;display:flex;flex-direction:column;gap:4px;padding:6px 0}
.done strong{color:var(--ci);font-size:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(32px);opacity:.5}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo"><i></i>Mutual</span>
    <h1 id="h1">내 지인들이 소개하는 사람들</h1>
    <p class="sub">지인이 직접 써준 소개 카드예요. 마음에 드는 분께 관심을 남기면 주선자가 연결해 드려요.</p>
  </header>

  <form id="gate" class="panel" novalidate>
    <label for="g-name">이름 <small>주선자에게만 전달돼요</small>
      <input id="g-name" autocomplete="name" placeholder="홍길동" required>
    </label>
    <label for="g-contact">연락처
      <input id="g-contact" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000 또는 이메일" required>
    </label>
    <label class="check" for="g-agree"><input id="g-agree" type="checkbox"> 관심을 남긴 카드의 주선자에게 이름·연락처가 전달되는 데 동의해요.</label>
    <p class="err" id="g-err" hidden></p>
    <button class="btn" type="submit">목록 보기</button>
  </form>

  <section id="feed" hidden>
    <div class="bar">
      <div class="chips" role="group" aria-label="성별 필터">
        <button class="chip" type="button" data-g="" aria-pressed="true">전체</button>
        <button class="chip" type="button" data-g="여성" aria-pressed="false">여성</button>
        <button class="chip" type="button" data-g="남성" aria-pressed="false">남성</button>
      </div>
      <p class="count" id="count"></p>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="sheet-bg" id="sheet-bg" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-nick"></div>
</div>

const UA = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "mobile" : "desktop";
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
function rid(){ const a="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; for(let i=0;i<10;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
let SID = store("mutual_sid"); if(!SID){ SID = rid(); store("mutual_sid", SID); }

function track(event, extra){
  const payload = Object.assign({event, ts:new Date().toISOString(), sid:SID, ref:REF, src:SRC, ua:UA}, extra||{});
  if(!LOG_ENDPOINT){ console.log("[track]", payload); return; }
  const body = JSON.stringify(payload);
  try{ if(navigator.sendBeacon && navigator.sendBeacon(LOG_ENDPOINT, new Blob([body], {type:"text/plain"}))) return; }catch(e){}
  fetch(LOG_ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body}).catch(()=>{});
}

let me = null; try{ me = JSON.parse(store("mutual_me") || "null"); }catch(e){}
let sent = {}; try{ sent = JSON.parse(store("mutual_sent") || "{}"); }catch(e){}
let filterG = "";
const HIDDEN = ["gxt577"]; // 목록에서 숨긴 카드 (상9)
for(let i=CARDS.length-1;i>=0;i--) if(HIDDEN.includes(CARDS[i].id)) CARDS.splice(i,1);

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const gc = c => c.g === "여성" ? "f" : "m";
const initial = c => esc(Array.from(c.nick.trim())[0] || "?");

track("view", {page:"list"});

$("gate").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("g-name").value.trim(), contact = $("g-contact").value.trim();
  const err = $("g-err");
  if(!name || !contact){ err.textContent = "이름과 연락처를 모두 입력해 주세요."; err.hidden = false; return; }
  if(!$("g-agree").checked){ err.textContent = "연락처 전달에 동의해야 관심을 남길 수 있어요."; err.hidden = false; return; }
  err.hidden = true;
  me = {name, contact}; store("mutual_me", JSON.stringify(me));
  track("signup", {name, contact});
  showFeed();
});

function showFeed(){
  $("gate").hidden = true; $("feed").hidden = false;
  $("h1").textContent = me.name + "님의 지인들이 소개하는 사람들";
  render();
  track("list_view", {cards: CARDS.length});
}

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filterG = b.dataset.g;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

function render(){
  const items = CARDS.filter(c => !filterG || c.g === filterG);
  $("count").textContent = items.length + "명";
  $("list").innerHTML = items.map(c => `
    <button class="card ${gc(c)}" type="button" data-id="${esc(c.id)}">
      <div class="head">
        <span class="av" aria-hidden="true">${initial(c)}</span>
        <span class="who"><span class="nick">${esc(c.nick)}</span><span class="meta">${esc(c.age)} · ${esc(c.area)}</span></span>
        <span class="pill">${esc(c.g)}</span>
      </div>
      <p class="job">${esc(c.job)}</p>
      <p class="intro">${esc(c.intro)}</p>
      <div class="foot"><span class="rel">${esc(c.rel)}</span><span>주선 ${esc(c.by)}</span>${sent[c.id] ? '<span class="sent">관심 보냄</span>' : ''}</div>
    </button>`).join("");
  $("list").querySelectorAll(".card").forEach(el => el.addEventListener("click", () => openCard(el.dataset.id)));
}

let lastFocus = null;
function openCard(id){
  const c = CARDS.find(x => x.id === id); if(!c) return;
  lastFocus = document.activeElement;
  track("card_open", {card:c.id});
  const s = $("sheet");
  s.className = "sheet " + gc(c);
  s.innerHTML = `
    <div class="s-top">
      <div class="head">
        <span class="av" aria-hidden="true">${initial(c)}</span>
        <span class="who"><h2 id="s-nick">${esc(c.nick)}</h2><span class="meta">${esc(c.age)} · ${esc(c.area)}</span></span>
        <span class="pill">${esc(c.g)}</span>
      </div>
      <p class="job">${esc(c.job)}</p>
    </div>
    <div class="s-body">
      <div class="sec"><b>주선자 ${esc(c.by)}의 소개 · ${esc(c.rel)}</b><p>${esc(c.intro)}</p></div>
      ${c.want ? `<div class="sec"><b>이런 분을 만나고 싶어해요</b><p>${esc(c.want)}</p></div>` : ""}
      <div id="s-action"></div>
    </div>`;
  if(sent[c.id]) showDone(c); else showAsk(c);
  $("sheet-bg").hidden = false;
  document.body.style.overflow = "hidden";
}
function showAsk(c){
  $("s-action").innerHTML = `
    <div class="row"><button class="btn ${gc(c)}" type="button" id="s-yes">관심 있어요</button><button class="btn ghost" type="button" id="s-close">닫기</button></div>`;
  $("s-yes").addEventListener("click", () => showForm(c));
  $("s-close").addEventListener("click", closeSheet);
  $("s-yes").focus();
}
function showForm(c){
  track("interest_open", {card:c.id});
  $("s-action").innerHTML = `
    <form id="s-form" style="display:flex;flex-direction:column;gap:12px">
      <label for="s-note">주선자 ${esc(c.by)}님께 한마디 <small>선택</small>
        <textarea id="s-note" maxlength="300" placeholder="예) 주선자님과 같은 MBA 동기예요"></textarea>
      </label>
      <p class="note">${esc(me.name)} · ${esc(me.contact)} 로 주선자에게 전달돼요. 상대방에게 바로 공개되지는 않아요.</p>
      <div class="row"><button class="btn ${gc(c)}" type="submit">관심 보내기</button><button class="btn ghost" type="button" id="s-back">취소</button></div>
    </form>`;
  $("s-back").addEventListener("click", () => showAsk(c));
  $("s-form").addEventListener("submit", e => {
    e.preventDefault();
    const note = $("s-note").value.trim();
    track("interest", {card:c.id, card_by:c.by, card_nick:c.nick, contact:me.contact, note:(me.name + (note ? " / " + note : ""))});
    sent[c.id] = 1; store("mutual_sent", JSON.stringify(sent));
    render(); showDone(c);
  });
  $("s-note").focus();
}
function showDone(c){
  $("s-action").innerHTML = `
    <div class="done"><strong>관심을 보냈어요</strong><p class="note">주선자 ${esc(c.by)}님이 확인 후 연락드려요.</p></div>
    <button class="btn ghost" type="button" id="s-close2" style="width:100%">목록으로</button>`;
  $("s-close2").addEventListener("click", closeSheet);
}
function closeSheet(){
  $("sheet-bg").hidden = true; document.body.style.overflow = "";
  if(lastFocus) lastFocus.focus();
}
$("sheet-bg").addEventListener("click", e => { if(e.target === $("sheet-bg")) closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("sheet-bg").hidden) closeSheet(); });

if(me && me.name && me.contact) showFeed();
</script>
</body>
</html>
