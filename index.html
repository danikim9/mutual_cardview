<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mutual 지인 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 단일 컬럼 모바일 피드. 상단 가입 게이트 → 필터 칩 → 카드 목록 → 바텀시트에서 관심 남기기 */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --ink:#1B1F32; --muted:#666B80; --line:#E2E4EC;
  --accent:#B8325E; --accent-soft:#F8E6EC; --ok:#2E7D5B;
  --display:"Gowun Batang",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141D; --surface:#1B1E2B; --ink:#ECEDF3; --muted:#9EA2B5; --line:#2C3042;
  --accent:#E9709A; --accent-soft:#3A2230; --ok:#6CC59B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141D; --surface:#1B1E2B; --ink:#ECEDF3; --muted:#9EA2B5; --line:#2C3042;
  --accent:#E9709A; --accent-soft:#3A2230; --ok:#6CC59B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{word-break:keep-all;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.brand{font:700 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:700 26px/1.3 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
input,textarea{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.check{flex-direction:row;align-items:flex-start;gap:8px;font-weight:400;font-size:13px}
.check input{width:auto;margin-top:3px}
.btn{font:600 15px var(--body);border:0;border-radius:12px;padding:14px;cursor:pointer;background:var(--accent);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.err{color:var(--accent);font-size:13px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font:500 13px var(--body);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.card:hover{border-color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nick{font:700 20px/1.3 var(--display);min-width:0;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);white-space:nowrap}
.job{font-weight:500}
.intro{margin:0;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.by{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-weight:500}
.sent{color:var(--ok);font-weight:600;font-size:13px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font:700 24px/1.3 var(--display);margin:0}
.sec{display:flex;flex-direction:column;gap:4px}
.sec b{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sec p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.note{font-size:12px;color:var(--muted);margin:0}
.done{text-align:center;padding:10px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">Mutual</span>
    <h1 id="h1">내 지인들이 소개하는 사람들</h1>
    <p class="sub" id="sub">지인이 직접 써준 소개 카드예요. 마음에 드는 분께 관심을 남기면 주선자가 연결해 드려요.</p>
  </header>

  <form id="gate" class="panel" novalidate>
    <label for="g-name">이름 (주선자에게만 전달돼요)
      <input id="g-name" autocomplete="name" placeholder="홍길동" required>
    </label>
    <label for="g-contact">연락처
      <input id="g-contact" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000 또는 이메일" required>
    </label>
    <label class="check" for="g-agree"><input id="g-agree" type="checkbox"> 관심을 남긴 카드의 주선자에게 이름·연락처가 전달되는 데 동의해요.</label>
    <p class="err" id="g-err" hidden></p>
    <button class="btn" type="submit">목록 보기</button>
  </form>

  <section id="feed" hidden>
    <div class="chips" role="group" aria-label="성별 필터">
      <button class="chip" type="button" data-g="" aria-pressed="true">전체</button>
      <button class="chip" type="button" data-g="여성" aria-pressed="false">여성</button>
      <button class="chip" type="button" data-g="남성" aria-pressed="false">남성</button>
    </div>
    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="sheet-bg" id="sheet-bg" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-nick"></div>
</div>

<script>
/* ===== 설정 =====
   LOG_ENDPOINT: 기존 파일럿 사이트가 이벤트를 보내는 주소(Apps Script 웹앱 URL 등)를 넣으세요.
   이벤트는 기존과 같은 형식 {event, ts, sid, ref, src, ua, ...} 으로 전송됩니다.
   새 이벤트: signup, list_view, card_open, interest_open(기존), interest(기존 컬럼과 동일) */
const LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbzwUYkG0gRpOVdZBZK1DkZ6bQH-93OysNQsF1SSxEcKDtkHOhoJAZ1DWyUXUpuXYxxP/exec";
const CARDS = [{"id": "pzmxdk", "by": "김다영", "rel": "고향·학창 시절 친구", "nick": "수아", "g": "남성", "age": "30대 중반", "job": "골프 관련 스타트업 대표", "area": "서울 강남권", "intro": "포스텍 학석박, 삼성전자 반도체 설계 과장 출신, 운동 매니아, 위스키 콜렉터, 쌉T", "want": "대화 잘 통하고 현명한, 결혼생각 있는 분"}, {"id": "kuxy6s", "by": "양말", "rel": "모임·동호회 친구", "nick": "핑크상어", "g": "여성", "age": "30대 중반", "job": "변호사", "area": "서울 강남권", "intro": "배려심이 깊고 대화를 즐겁게 이끌어줘요! 제테크 만렙에 삼개국어까지!", "want": "마음이 따듯하고 선하신 분. 대화가 잘 통했으면 좋겠어요."}, {"id": "j7m7wn", "by": "양털", "rel": "모임·동호회 친구", "nick": "Life is Good", "g": "남성", "age": "30대 초반", "job": "2차전지 개발", "area": "서울 강남권", "intro": "선하고 사려가 깊어요. 자가준비 완료에 자기계발도 끊임없이 합니다!", "want": "대화가 잘 통하고 긍정적이신 분"}, {"id": "wcjxy2", "by": "도영빈", "rel": "회사 동료", "nick": "야구광", "g": "남성", "age": "30대 후반 이상", "job": "야구단 마케팅", "area": "경기·인천", "intro": "능력좋고 성격 좋은 애주가", "want": "30대초 결혼을 염두에 두신 분"}, {"id": "fq685j", "by": "민재철", "rel": "고향·학창 시절 친구", "nick": "캣대디", "g": "남성", "age": "30대 초반", "job": "운수업", "area": "경기·인천", "intro": "\"제가 10년 넘게 옆에서 봐온 친구인데, 한 번 맺은 인연은 끝까지 책임지는 의리 있고 진국인 사람이에요.\"", "want": "\"나이는 96~99년생 정도면 좋겠고, 대화가 잘 통하는 분이면 더 좋을 것 같아요.\""}, {"id": "wz8t44", "by": "HS", "rel": "회사 동료", "nick": "YS", "g": "여성", "age": "30대 초반", "job": "금융공공기관", "area": "서울 강북권", "intro": "성실 건강 현명 예의 친절", "want": "느낌있는 30대 초반"}, {"id": "bpkzrp", "by": "다니", "rel": "고향·학창 시절 친구", "nick": "문변", "g": "여성", "age": "30대 중반", "job": "변호사", "area": "서울 강남권", "intro": "사슴상에 야무진 글로벌기업 엘리트", "want": "키가 크고, 자상한 사람"}, {"id": "5w7x6t", "by": "다니", "rel": "회사 동료", "nick": "중국미녀", "g": "여성", "age": "30대 초반", "job": "중국시장 사업자 대표", "area": "서울 강남권", "intro": "3대 엔터사 전략실 출신, 중국어 원어민 수준, IP 관련 사업, 홍콩 미녀배우 느낌", "want": "현명하고 다정한 테토남"}, {"id": "z8zebh", "by": "다니", "rel": "MBA·대학원 동기", "nick": "쮸", "g": "여성", "age": "20대 후반", "job": "슈퍼카 관련 사업자 대표", "area": "경기·인천", "intro": "가업승계로 슈퍼카 관련 사업장 운영, 한강뷰 자가, 분당 자가 보유, 큐트섹시 미녀", "want": "잘생긴 테토남 좋아요"}, {"id": "r5gjna", "by": "다니", "rel": "MBA·대학원 동기", "nick": "씅", "g": "여성", "age": "30대 초반", "job": "대학원생", "area": "서울 강북권", "intro": "키크고 전형적인 미인상, 일본어 원어민 수준, 해외경력파", "want": "키큰 테토남 좋아요"}, {"id": "xrpy8p", "by": "다니", "rel": "MBA·대학원 동기", "nick": "동동이", "g": "남성", "age": "30대 중반", "job": "한국관광공사", "area": "그 외 지역", "intro": "선하지만 장난끼있는 살림 잘하는 준비된 남자", "want": "무던하면서 장난을 잘 받아줄 센스있는 분"}, {"id": "dss9w2", "by": "장은혜", "rel": "기타", "nick": "녜", "g": "여성", "age": "30대 초반", "job": "MBA 재학 (전 자산운용역)", "area": "서울 강북권", "intro": "배려심 있고 상대방 얘기를 잘 들어줘요\n(+잘 웃음)", "want": "키 크고 다정한 사람"}, {"id": "w7pstr", "by": "지다", "rel": "고향·학창 시절 친구", "nick": "짇", "g": "남성", "age": "30대 중반", "job": "음악", "area": "서울 강북권", "intro": "istj", "want": "말 잘통하는 사람 에너지 많이 안높은 사람"}, {"id": "hkbzbg", "by": "수아", "rel": "기타", "nick": "문형", "g": "남성", "age": "30대 후반 이상", "job": "대기업", "area": "서울 강남권", "intro": "숙취 없는게 부러움", "want": ""}, {"id": "r45jz2", "by": "수아", "rel": "기타", "nick": "하이록스", "g": "남성", "age": "30대 중반", "job": "부동산", "area": "서울 강남권", "intro": "잘생김", "want": ""}, {"id": "gxt577", "by": "다니", "rel": "모임·동호회 친구", "nick": "상9", "g": "남성", "age": "30대 중반", "job": "외국계 투자 자문사", "area": "서울 강북권", "intro": "무던하고 말을 예쁘게 하는 다정다감 안정형", "want": "밝고 긍정적인 에너지, 자기개발을 위해 노력하는 사람"}, {"id": "s8r46s", "by": "복숭아", "rel": "고향·학창 시절 친구", "nick": "유찌", "g": "여성", "age": "30대 초반", "job": "브랜드마케터", "area": "서울 강남권", "intro": "따뜻하고 다정한 마음을 가진, 함께 있으면 편안하고 힐링되는 30대초중반 커리어우먼", "want": "다정하고 자기 일에 열정이 있는 분"}, {"id": "u6duh3", "by": "C", "rel": "대학 동기·선후배", "nick": "Lu", "g": "여성", "age": "20대 후반", "job": "사회복지사", "area": "그 외 지역", "intro": "홍콩 출신의 아담한 친구예요. 다정하고 세심해서 주변 사람을 잘 챙기는 편이에요. 최근 사회복지학 석사를 마쳤고, 연애와 가정을 소중하게 생각해요. 진지하게 오래 만날 수 있는 좋은 인연을 찾고 있어요.", "want": "한국-홍콩 간의 거리에 부담이 없고 영어로 소통할 수 있는 분이면 좋겠어요. 30~40대의 미혼이며 자녀가 없는 분, 가정을 소중히 여기고 진지"}, {"id": "vuxvas", "by": "송준영", "rel": "기타", "nick": "나무", "g": "남성", "age": "30대 중반", "job": "인증컨설턴트", "area": "서울 강남권", "intro": "자기관리가 철저하고 매너가 좋은친구", "want": "서로 다른걸 틀리다고 안하는 사람, 술을 즐기지 않는 사람, 집순이"}];

const qs = new URLSearchParams(location.search);
const REF = qs.get("ref") || "";
const SRC = qs.get("src") || "list";
const UA = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "mobile" : "desktop";
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
function rid(){ const a="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; for(let i=0;i<10;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
let SID = store("mutual_sid"); if(!SID){ SID = rid(); store("mutual_sid", SID); }

function track(event, extra){
  const payload = Object.assign({event, ts:new Date().toISOString(), sid:SID, ref:REF, src:SRC, ua:UA}, extra||{});
  if(!LOG_ENDPOINT){ console.log("[track]", payload); return; }
  const body = JSON.stringify(payload);
  try{
    if(navigator.sendBeacon && navigator.sendBeacon(LOG_ENDPOINT, new Blob([body], {type:"text/plain"}))) return;
  }catch(e){}
  fetch(LOG_ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body}).catch(()=>{});
}

let me = null; try{ me = JSON.parse(store("mutual_me") || "null"); }catch(e){}
let sent = {}; try{ sent = JSON.parse(store("mutual_sent") || "{}"); }catch(e){}
let filterG = "";

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

track("view", {page:"list"});

$("gate").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("g-name").value.trim(), contact = $("g-contact").value.trim();
  const err = $("g-err");
  if(!name || !contact){ err.textContent = "이름과 연락처를 모두 입력해 주세요."; err.hidden = false; return; }
  if(!$("g-agree").checked){ err.textContent = "연락처 전달에 동의해야 관심을 남길 수 있어요."; err.hidden = false; return; }
  err.hidden = true;
  me = {name, contact}; store("mutual_me", JSON.stringify(me));
  track("signup", {name, contact});
  showFeed();
});

function showFeed(){
  $("gate").hidden = true; $("feed").hidden = false;
  $("h1").textContent = me.name + "님의 지인들이 소개하는 사람들";
  render();
  track("list_view", {cards: CARDS.length});
}

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filterG = b.dataset.g;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));

function render(){
  const items = CARDS.filter(c => !filterG || c.g === filterG);
  $("count").textContent = items.length + "명";
  $("list").innerHTML = items.map(c => `
    <button class="card" type="button" data-id="${esc(c.id)}">
      <div class="top"><span class="nick">${esc(c.nick)}</span><span class="meta">${esc(c.g)} · ${esc(c.age)}</span></div>
      <div><span class="job">${esc(c.job)}</span> <span class="meta">· ${esc(c.area)}</span></div>
      <p class="intro">${esc(c.intro)}</p>
      <div class="by"><span class="tag">${esc(c.rel)}</span><span>주선 ${esc(c.by)}</span>${sent[c.id] ? '<span class="sent">· 관심 보냄</span>' : ''}</div>
    </button>`).join("");
  $("list").querySelectorAll(".card").forEach(el => el.addEventListener("click", () => openCard(el.dataset.id)));
}

let lastFocus = null;
function openCard(id){
  const c = CARDS.find(x => x.id === id); if(!c) return;
  lastFocus = document.activeElement;
  track("card_open", {card:c.id});
  const s = $("sheet");
  s.innerHTML = `
    <div class="top"><h2 id="s-nick">${esc(c.nick)}</h2><span class="meta">${esc(c.g)} · ${esc(c.age)}</span></div>
    <div><span class="job">${esc(c.job)}</span> <span class="meta">· ${esc(c.area)}</span></div>
    <div class="sec"><b>주선자 ${esc(c.by)}의 소개 · ${esc(c.rel)}</b><p>${esc(c.intro)}</p></div>
    ${c.want ? `<div class="sec"><b>이런 분을 만나고 싶어해요</b><p>${esc(c.want)}</p></div>` : ""}
    <div id="s-action"></div>`;
  if(sent[c.id]) showDone(c); else showAsk(c);
  $("sheet-bg").hidden = false;
  document.body.style.overflow = "hidden";
}
function showAsk(c){
  $("s-action").innerHTML = `
    <div class="row"><button class="btn" type="button" id="s-yes">관심 있어요</button><button class="btn ghost" type="button" id="s-close">닫기</button></div>`;
  $("s-yes").addEventListener("click", () => showForm(c));
  $("s-close").addEventListener("click", closeSheet);
  $("s-yes").focus();
}
function showForm(c){
  track("interest_open", {card:c.id});
  $("s-action").innerHTML = `
    <form id="s-form" style="display:flex;flex-direction:column;gap:12px">
      <label for="s-note">주선자 ${esc(c.by)}님께 한마디 (선택)
        <textarea id="s-note" maxlength="300" placeholder="예) 주선자님과 같은 MBA 동기예요"></textarea>
      </label>
      <p class="note">${esc(me.name)} · ${esc(me.contact)} 로 주선자에게 전달돼요. 상대방에게 바로 공개되지는 않아요.</p>
      <div class="row"><button class="btn" type="submit">관심 보내기</button><button class="btn ghost" type="button" id="s-back">취소</button></div>
    </form>`;
  $("s-back").addEventListener("click", () => showAsk(c));
  $("s-form").addEventListener("submit", e => {
    e.preventDefault();
    const note = $("s-note").value.trim();
    track("interest", {card:c.id, card_by:c.by, card_nick:c.nick, contact:me.contact, note:(me.name + (note ? " / " + note : ""))});
    sent[c.id] = 1; store("mutual_sent", JSON.stringify(sent));
    render(); showDone(c);
  });
  $("s-note").focus();
}
function showDone(c){
  $("s-action").innerHTML = `
    <div class="done"><p class="sent">관심을 보냈어요</p><p class="note">주선자 ${esc(c.by)}님이 확인 후 연락드려요.</p></div>
    <button class="btn ghost" type="button" id="s-close2">목록으로</button>`;
  $("s-close2").addEventListener("click", closeSheet);
}
function closeSheet(){
  $("sheet-bg").hidden = true; document.body.style.overflow = "";
  if(lastFocus) lastFocus.focus();
}
$("sheet-bg").addEventListener("click", e => { if(e.target === $("sheet-bg")) closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("sheet-bg").hidden) closeSheet(); });

if(me && me.name && me.contact) showFeed();
</script>
</body>
</html>
